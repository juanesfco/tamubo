[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tamubo"
version = "0.0.1"
description = "TAMU Bayesian Optimization tools"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["tamubo", "tamubo.exactbo", "tamubo.gpugp", "tamubo.mobbo"]
